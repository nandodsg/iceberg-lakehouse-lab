[project]
name = "lab-ingestion"
version = "0.1.0"
description = "Iceberg Lakehouse Lab — batch extractor: approved source exports -> Iceberg bronze"
requires-python = ">=3.12"
dependencies = [
    "pyiceberg[sql-sqlite,pyarrow]>=0.9",
    "pyarrow>=17",
    "pydantic>=2",
    "pyyaml>=6",
    "typer>=0.12",
    "tzdata>=2024.1",  # zoneinfo on Windows (Arrow timestamp statistics)
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery[bqstorage]>=3", "google-auth>=2"]
postgres = ["psycopg[binary]>=3"]
glue = ["pyiceberg[glue,s3fs]>=0.9"]
dev = ["pytest>=8", "duckdb>=1"]

[project.scripts]
lab-ingest = "lab_ingestion.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
